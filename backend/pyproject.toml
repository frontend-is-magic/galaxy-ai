[project]
name = "galaxy-ai-backend"
version = "0.1.0"
description = "Local-first FastAPI backend for Galaxy AI."
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "accelerate>=1.0.0",
  "datasets[vision]>=3.0.0",
  "evaluate>=0.4.0",
  "fastapi>=0.115.0",
  "huggingface-hub>=0.26.0",
  "pillow>=10.0.0",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.6.0",
  "safetensors>=0.4.0",
  "torch>=2.4.0",
  "torchvision>=0.19.0",
  "transformers>=4.52.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
